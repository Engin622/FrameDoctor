<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" rx="28" fill="#120d0e"/>
  <style>.t{font:700 26px 'Segoe UI',sans-serif;fill:#fff}.s{font:16px 'Segoe UI',sans-serif;fill:#d6b8b8}.k{font:700 16px 'Segoe UI',sans-serif;fill:#ff625a}</style>
  <g transform="translate(35 35)"><rect width="350" height="290" rx="22" fill="#201719" stroke="#493235"/><text class="t" x="25" y="48">NORMAL</text><text class="k" x="25" y="82">Günlük kullanım</text><text class="s" x="25" y="125">• En korumacı profil</text><text class="s" x="25" y="158">• Windows işlevleri korunur</text><text class="s" x="25" y="191">• Hafif arka plan düzenlemesi</text><text class="s" x="25" y="224">• Kolay geri dönüş</text></g>
  <g transform="translate(425 35)"><rect width="350" height="290" rx="22" fill="#27191a" stroke="#98413b"/><text class="t" x="25" y="48">ORTA</text><text class="k" x="25" y="82">Dengeli oyun sistemi</text><text class="s" x="25" y="125">• Performans / işlev dengesi</text><text class="s" x="25" y="158">• Daha az arka plan yükü</text><text class="s" x="25" y="191">• Oyuncular için önerilen</text><text class="s" x="25" y="224">• Seçimler düzenlenebilir</text></g>
  <g transform="translate(815 35)"><rect width="350" height="290" rx="22" fill="#321817" stroke="#ff4b43"/><text class="t" x="25" y="48">EN İYİ PERFORMANS</text><text class="k" x="25" y="82">Minimum arka plan</text><text class="s" x="25" y="125">• En agresif öneri listesi</text><text class="s" x="25" y="158">• Daha fazla servis/özellik seçimi</text><text class="s" x="25" y="191">• Uygulamadan önce kontrol şart</text><text class="s" x="25" y="224">• Tek tek özelleştirilebilir</text></g>
</svg>
